name: Publish character workshop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check character data and paper interactions
        run: |
          node tests/model-check.mjs
          node tests/held-rotation-check.mjs
          node tests/free-composition-check.mjs
          node tests/atomic-paper-check.mjs
          node tests/group-composition-check.mjs
          node tests/layers-check.mjs
          node tests/unified-sheet-check.mjs
          node tests/corner-peel-check.mjs
          node tests/preserved-version-check.mjs
      - name: Prepare workshop home and design studies
        run: |
          node scripts/build-pages.mjs
          node tests/preserved-version-check.mjs --built
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
